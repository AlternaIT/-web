<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Alterna | Iniciar sesión</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Alterna">
    <!-- Apple touch icon (usa el logo inline en base64 — reemplazar con icons/icon-192.png una vez generados) -->
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:        #0f0f0f;
            --surface:   #1c1c1e;
            --border:    rgba(255,255,255,.08);
            --text:      #f5f5f7;
            --muted:     #8e8e93;
            --accent:    #f5f5f7;
            --input-bg:  #2c2c2e;
            --input-border: rgba(255,255,255,.1);
            --input-focus:  rgba(255,255,255,.3);
            --error-bg:  rgba(255,69,58,.12);
            --error:     #ff453a;
        }

        body {
            min-height: 100vh;
            display: flex;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        /* ── PANEL IZQUIERDO ── */
        .left {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 80px;
            position: relative;
            overflow: hidden;
        }

        .left::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 30% 40%, rgba(255,255,255,.035) 0%, transparent 70%),
                radial-gradient(ellipse 40% 60% at 80% 80%, rgba(255,255,255,.02) 0%, transparent 60%);
            pointer-events: none;
        }

        .left-inner {
            width: 100%;
            max-width: 360px;
            position: relative;
            z-index: 1;
        }

        /* LOGO */
        .logo-wrap {
            margin-bottom: 48px;
        }

        .logo-wrap img {
            height: 32px;
            width: auto;
            filter: brightness(0) invert(1);
        }

        /* TÍTULO */
        .heading {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -.4px;
            color: var(--text);
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .subheading {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 36px;
            font-weight: 400;
        }

        /* FORM */
        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 7px;
            letter-spacing: .01em;
        }

        .input-wrap {
            position: relative;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text);
            outline: none;
            transition: border-color .2s, box-shadow .2s;
            -webkit-appearance: none;
        }

        input::placeholder { color: #48484a; }

        input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(255,255,255,.06);
        }

        /* ── AUTOFILL: neutraliza el fondo azul/blanco en todos los navegadores ── */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 999px #2c2c2e inset !important;
            box-shadow: 0 0 0 999px #2c2c2e inset !important;
            -webkit-text-fill-color: #f5f5f7 !important;
            caret-color: #f5f5f7;
            border-color: rgba(255,255,255,.1) !important;
            transition: background-color 9999s ease 0s;
        }

        input:-webkit-autofill:focus {
            border-color: rgba(255,255,255,.3) !important;
            box-shadow: 0 0 0 999px #2c2c2e inset, 0 0 0 3px rgba(255,255,255,.06) !important;
        }

        /* Firefox */
        input:autofill {
            background: #2c2c2e !important;
            color: #f5f5f7 !important;
        }

        .toggle-pass {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            user-select: none;
            transition: color .15s;
        }
        .toggle-pass:hover { color: var(--text); }

        /* ERROR */
        .error-box {
            display: none;
            padding: 11px 14px;
            background: var(--error-bg);
            border: 1px solid rgba(255,69,58,.2);
            border-radius: 9px;
            color: var(--error);
            font-size: 13px;
            margin-bottom: 18px;
            line-height: 1.4;
        }

        /* BOTÓN */
        .btn {
            width: 100%;
            padding: 13px;
            background: var(--text);
            color: #0f0f0f;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: opacity .15s, transform .1s;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover:not(:disabled) { opacity: .88; }
        .btn:active:not(:disabled) { transform: scale(.99); }
        .btn:disabled { opacity: .4; cursor: not-allowed; }

        .spinner {
            width: 15px; height: 15px;
            border: 2px solid rgba(0,0,0,.2);
            border-top-color: #0f0f0f;
            border-radius: 50%;
            animation: spin .65s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* FOOTER */
        .form-footer {
            margin-top: 28px;
            text-align: center;
            font-size: 12px;
            color: #3a3a3c;
        }

        /* ── PANEL DERECHO ── */
        .right {
            width: 420px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 48px;
            position: relative;
            overflow: hidden;
        }

        .right::before {
            content: '';
            position: absolute;
            top: -120px;
            right: -120px;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,.04) 0%, transparent 70%);
            pointer-events: none;
        }

        .right-content {
            position: relative;
            z-index: 1;
            width: 100%;
        }

        .right-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .1em;
            color: #48484a;
            text-transform: uppercase;
            margin-bottom: 28px;
        }

        .stat-block {
            margin-bottom: 32px;
        }

        .stat-num {
            font-size: 42px;
            font-weight: 300;
            letter-spacing: -1.5px;
            color: var(--text);
            line-height: 1;
        }

        .stat-desc {
            font-size: 13px;
            color: var(--muted);
            margin-top: 6px;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 28px 0;
        }

        .feature-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .feature-list li {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
        }

        .feature-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #48484a;
            margin-top: 6px;
            flex-shrink: 0;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 820px) {
            .right { display: none; }
            .left { padding: 40px 28px; }
        }

        /* ── PWA INSTALL BANNER ── */
        .install-banner {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #1c1c1e;
            border-top: 1px solid rgba(255,255,255,.1);
            padding: 16px 20px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            z-index: 999;
            animation: slideUp .3s ease;
        }
        .install-banner.visible { display: flex; align-items: center; gap: 14px; }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        .install-banner-icon {
            width: 44px; height: 44px; border-radius: 10px;
            background: #2c2c2e; display: flex; align-items: center;
            justify-content: center; flex-shrink: 0; overflow: hidden;
        }
        .install-banner-icon img { width: 32px; height: auto; filter: brightness(0) invert(1); }

        .install-banner-text { flex: 1; min-width: 0; }
        .install-banner-title { font-size: 13px; font-weight: 600; color: #f5f5f7; }
        .install-banner-sub   { font-size: 11px; color: #8e8e93; margin-top: 2px; }

        .install-banner-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .install-btn {
            padding: 8px 16px; border-radius: 8px; font-size: 13px;
            font-weight: 600; cursor: pointer; border: none; font-family: inherit;
        }
        .install-btn-primary { background: #f5f5f7; color: #0f0f0f; }
        .install-btn-dismiss { background: transparent; color: #8e8e93; border: 1px solid rgba(255,255,255,.12); }

        /* ── UPDATE TOAST ── */
        .update-toast {
            display: none;
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            background: #1c1c1e; border: 1px solid rgba(255,255,255,.12);
            border-radius: 10px; padding: 12px 18px;
            color: #f5f5f7; font-size: 13px;
            box-shadow: 0 8px 30px rgba(0,0,0,.4);
            z-index: 9999; white-space: nowrap;
            display: none; align-items: center; gap: 12px;
        }
        .update-toast.visible { display: flex; }
        .update-toast-btn {
            background: #f5f5f7; color: #0f0f0f;
            border: none; border-radius: 6px;
            padding: 5px 12px; font-size: 12px;
            font-weight: 600; cursor: pointer; font-family: inherit;
        }
    </style>
</head>

<!-- ── UPDATE TOAST ── -->
<div class="update-toast" id="updateToast">
    ✦ Nueva versión disponible
    <button class="update-toast-btn" onclick="applyUpdate()">Actualizar</button>
</div>

<script>
    const SUPABASE_URL = "https://nxbncqixxlmdvepapuqe.supabase.co";
    const SUPABASE_KEY = "sb_publishable_2nsr-fPUd1FJYLyWJf_UiQ_N7kaYKFv";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Cargar stat
    (async () => {
        const { count } = await sb.from("actividades").select("*", { count: "exact", head: true });
        if (count != null) document.getElementById("statNum").textContent = count;
    })();

    // Toggle password
    document.getElementById("togglePass").addEventListener("click", function() {
        const input = document.getElementById("contrasena");
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        this.textContent = show ? "Ocultar" : "Mostrar";
    });

    // Enter key
    document.addEventListener("keydown", e => {
        if (e.key === "Enter") handleLogin();
    });

    function setLoading(on) {
        document.getElementById("btnLogin").disabled = on;
        document.getElementById("spinner").style.display = on ? "block" : "none";
        document.getElementById("btnText").textContent = on ? "Verificando..." : "Iniciar sesión";
    }

    function showError(msg) {
        const box = document.getElementById("errorBox");
        box.textContent = msg;
        box.style.display = "block";
    }

    function hideError() {
        document.getElementById("errorBox").style.display = "none";
    }

    /* ═══════════════════════════════════════════
       PWA — Service Worker + Install Banner
    ═══════════════════════════════════════════ */
    let deferredPrompt = null;
    let newWorker = null;

    // Registrar Service Worker
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").then((reg) => {

            // Detectar si hay una actualización disponible
            reg.addEventListener("updatefound", () => {
                newWorker = reg.installing;
                newWorker.addEventListener("statechange", () => {
                    // Solo mostramos el toast si ya había un SW activo (no la primera instalación)
                    if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
                        document.getElementById("updateToast").classList.add("visible");
                    }
                });
            });

            // Verificar actualización cada vez que la página se activa (usuario vuelve a la pestaña)
            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible") {
                    reg.update();
                }
            });
        });

        // Cuando el nuevo SW toma control, recargar automáticamente
        navigator.serviceWorker.addEventListener("controllerchange", () => {
            window.location.reload();
        });
    }

    // Capturar el evento de instalación del navegador
    window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;

        // Solo mostrar el banner en móvil
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const dismissed = sessionStorage.getItem("installDismissed");

        if (isMobile && !dismissed) {
            setTimeout(() => {
                document.getElementById("installBanner").classList.add("visible");
            }, 1500);
        }
    });

    async function doInstall() {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        document.getElementById("installBanner").classList.remove("visible");
    }

    function dismissInstall() {
        sessionStorage.setItem("installDismissed", "1");
        document.getElementById("installBanner").classList.remove("visible");
    }

    function applyUpdate() {
        if (newWorker) {
            newWorker.postMessage("SKIP_WAITING");
        }
        document.getElementById("updateToast").classList.remove("visible");
    }

    async function handleLogin() {
        hideError();
        const correo = document.getElementById("correo").value.trim();
        const contrasena = document.getElementById("contrasena").value;

        if (!correo || !contrasena) {
            showError("Ingresa tu correo y contraseña.");
            return;
        }

        setLoading(true);

        try {
            const { data, error } = await sb.rpc("login_usuario", {
                p_correo: correo,
                p_contraseña: contrasena
            });

            if (error) { showError("No fue posible conectar con el servidor."); return; }
            if (!data || data.length === 0) { showError("Correo o contraseña incorrectos."); return; }

            const usuario = data[0];
            if (usuario.activo !== true) { showError("Tu usuario se encuentra desactivado."); return; }

            localStorage.setItem("usuario", JSON.stringify(usuario));
            window.location.href = "dashboard.html";

        } catch(e) {
            showError("Ocurrió un error inesperado.");
        } finally {
            setLoading(false);
        }
    }
</script>

</body>
</html>
