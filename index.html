<body>


<div class="login-container">


    <div class="login-card">


        <!-- =====================================
             LOGO
        ====================================== -->

        <div class="logo">

            <div class="logo-icon">
                A
            </div>

            <h1>
                Alterna
            </h1>

            <p>
                Sistema de Gestión
            </p>

        </div>


        <!-- =====================================
             ERROR
        ====================================== -->

        <div
            id="errorMessage"
            class="error"
        ></div>


        <!-- =====================================
             LOGIN
        ====================================== -->

        <form id="loginForm">


            <!-- CORREO -->

            <div class="form-group">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="correo@alterna.pro"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- CONTRASEÑA -->

            <div class="form-group">

                <label for="contraseña">
                    Contraseña
                </label>


                <div class="password-container">

                    <input
                        type="password"
                        id="contraseña"
                        name="contraseña"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                    >


                    <span
                        class="show-password"
                        id="showPassword"
                    >
                        Mostrar
                    </span>

                </div>

            </div>


            <!-- BOTÓN -->

            <button
                type="submit"
                id="loginButton"
            >

                <span id="buttonText">
                    Iniciar sesión
                </span>


                <span
                    id="loading"
                    class="loading"
                >

                    <span class="spinner"></span>

                    Verificando...

                </span>

            </button>


        </form>


        <!-- FOOTER -->

        <div class="footer">

            Asociación Alterna ONG

        </div>


    </div>


</div>


<script>


    /* =================================================
       CONFIGURACIÓN SUPABASE
    ================================================= */


    const SUPABASE_URL =
        "https://nxbncqixxlmdvepapuqe.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_2nsr-fPUd1FJYLyWJf_UiQ_N7kaYKFv";


    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );



    /* =================================================
       ELEMENTOS
    ================================================= */


    const loginForm =
        document.getElementById("loginForm");


    const loginButton =
        document.getElementById("loginButton");


    const buttonText =
        document.getElementById("buttonText");


    const loading =
        document.getElementById("loading");


    const errorMessage =
        document.getElementById("errorMessage");


    const correoInput =
        document.getElementById("correo");


    const contraseñaInput =
        document.getElementById("contraseña");


    const showPassword =
        document.getElementById("showPassword");



    /* =================================================
       MOSTRAR / OCULTAR CONTRASEÑA
    ================================================= */


    showPassword.addEventListener(
        "click",
        function() {

            if (
                contraseñaInput.type ===
                "password"
            ) {

                contraseñaInput.type =
                    "text";

                showPassword.textContent =
                    "Ocultar";

            } else {

                contraseñaInput.type =
                    "password";

                showPassword.textContent =
                    "Mostrar";

            }

        }
    );



    /* =================================================
       MOSTRAR ERROR
    ================================================= */


    function mostrarError(mensaje) {

        errorMessage.textContent =
            mensaje;

        errorMessage.style.display =
            "block";

    }



    /* =================================================
       OCULTAR ERROR
    ================================================= */


    function ocultarError() {

        errorMessage.textContent =
            "";

        errorMessage.style.display =
            "none";

    }



    /* =================================================
       ESTADO DE CARGA
    ================================================= */


    function cambiarEstadoCarga(cargando) {

        loginButton.disabled =
            cargando;


        if (cargando) {

            buttonText.style.display =
                "none";

            loading.style.display =
                "flex";

        } else {

            buttonText.style.display =
                "inline";

            loading.style.display =
                "none";

        }

    }



    /* =================================================
       LOGIN
    ================================================= */


    loginForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            ocultarError();


            const correo =
                correoInput.value
                    .trim();


            const contraseña =
                contraseñaInput.value;


            if (!correo || !contraseña) {

                mostrarError(
                    "Ingresa tu correo y contraseña."
                );

                return;

            }


            cambiarEstadoCarga(true);


            try {


                /* =====================================
                   CONSULTA A SUPABASE
                ====================================== */


                const { data, error } =
                    await supabaseClient.rpc(
                        "login_usuario",
                        {
                            p_correo:
                                correo,

                            p_contraseña:
                                contraseña
                        }
                    );


                console.log(
                    "Respuesta Supabase:",
                    data
                );


                /* =====================================
                   ERROR DE SUPABASE
                ====================================== */


                if (error) {

                    console.error(
                        "Error Supabase:",
                        error
                    );


                    mostrarError(
                        "No fue posible conectar con el servidor."
                    );


                    return;

                }


                /* =====================================
                   USUARIO NO ENCONTRADO
                ====================================== */


                if (
                    !data ||
                    data.length === 0
                ) {

                    mostrarError(
                        "Correo o contraseña incorrectos."
                    );


                    return;

                }


                /* =====================================
                   USUARIO
                ====================================== */


                const usuario =
                    data[0];


                /* =====================================
                   VERIFICAR ACTIVO
                ====================================== */


                if (
                    usuario.activo !== true
                ) {

                    mostrarError(
                        "Tu usuario se encuentra desactivado."
                    );


                    return;

                }


                /* =====================================
                   GUARDAR SESIÓN
                ====================================== */


                localStorage.setItem(
                    "usuario",
                    JSON.stringify(usuario)
                );


                /* =====================================
                   REDIRECCIÓN
                ====================================== */


                window.location.href =
                    "dashboard.html";


            } catch (error) {

                console.error(
                    "Error inesperado:",
                    error
                );


                mostrarError(
                    "Ocurrió un error inesperado."
                );


            } finally {

                cambiarEstadoCarga(false);

            }

        }
    );


</script>


</body>

</html>
