<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Alterna | Servidor</title>
    <!--
      Puente al panel del servidor Ubuntu (estadísticas y escritorio remoto).
      · El panel tiene una dirección secreta (solo IT). Aquí se manda la sesión de Alterna al servidor;
        si es válida y tiene acceso a IT, el servidor responde con esa dirección y se abre.
      · Sin sesión: va al login de Alterna y, al entrar, apps.html regresa aquí solo.
      · #salir: la sesión guardada ya no vale → se pide entrar de nuevo.
      · Desde GitHub Pages (respaldo) se pasa al servidor, porque la sesión se guarda por dirección.
    -->
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(ellipse 60% 50% at 30% 30%, rgba(255,255,255,.04) 0%, transparent 70%),
                #0f0f0f;
            color: #f5f5f7; -webkit-font-smoothing: antialiased;
        }
        .caja { width: min(360px, calc(100% - 32px)); }
        img { height: 30px; width: auto; filter: brightness(0) invert(1); margin-bottom: 40px; }
        h1 { margin: 0 0 6px; font-size: 24px; font-weight: 600; letter-spacing: -.4px; }
        p { margin: 0 0 26px; font-size: 14px; color: #8e8e93; line-height: 1.5; }
        .giro { width: 24px; height: 24px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.12); border-top-color: #f5f5f7; animation: g .8s linear infinite; }
        @keyframes g { to { transform: rotate(360deg); } }
        a.btn { display: none; text-align: center; padding: 13px; border-radius: 10px; background: #f5f5f7; color: #111112; font-weight: 600; font-size: 14px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="caja">
        <img src="logo-alterna.png" alt="Alterna">
        <h1>Servidor Alterna</h1>
        <p id="texto">Abriendo el servidor con tu sesión de Alterna…</p>
        <div class="giro" id="giro"></div>
        <a class="btn" id="btn" href="servidor.html">Intentar de nuevo</a>
    </div>
<script>
    const SERVIDOR = "https://srv.tailbbc6ef.ts.net";
    const $ = (id) => document.getElementById(id);

    function falla(texto) {
        $("texto").textContent = texto;
        $("giro").style.display = "none";
        $("btn").style.display = "block";
    }

    function alLogin() {
        // Sin sesión: al login de Alterna; después del login, apps.html regresa a esta página
        try { localStorage.removeItem("usuario"); } catch { /* sin almacenamiento */ }
        try { sessionStorage.setItem("alterna_volver", "servidor.html"); } catch { /* sin almacenamiento */ }
        $("texto").textContent = "Inicia sesión en Alterna para entrar al servidor…";
        location.replace("index.html");
    }

    (async () => {
        // Esta página solo funciona servida por el propio servidor (misma dirección que el panel)
        if (location.hostname.endsWith("github.io") || !location.protocol.startsWith("http")) {
            location.replace(SERVIDOR + "/servidor.html");
            return;
        }
        let token = "";
        if (location.hash === "#salir") {
            history.replaceState(null, "", location.pathname);
            return alLogin();
        }
        try { token = JSON.parse(localStorage.getItem("usuario"))?.token || ""; } catch { /* sin sesión */ }
        if (!/^[\w-]{16,128}$/.test(token)) return alLogin();

        try {
            const r = await fetch("/api/sso", {
                method: "POST", credentials: "same-origin", cache: "no-store",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token }),
            });
            const d = await r.json().catch(() => ({}));
            if (r.ok && typeof d.panel === "string" && /^\/[\w-]{40,}\/$/.test(d.panel)) {
                location.replace(d.panel);
                return;
            }
            if (r.status === 401) return alLogin();
            if (r.status === 403) return falla(d.error || "Tu usuario de Alterna no tiene acceso al servidor.");
            falla(d.error || "No se pudo abrir el servidor. Inténtalo de nuevo.");
        } catch {
            falla("No se pudo abrir el servidor. Revisa tu conexión e inténtalo de nuevo.");
        }
    })();
</script>
</body>
</html>
