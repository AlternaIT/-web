<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Alterna | Servidor</title>
    <!--
      Puente al servidor (panel y escritorio remoto del Ubuntu).
      · Con sesión de Alterna: abre el servidor y le pasa la sesión (#alterna=…, nunca viaja en la URL
        al servidor web; el panel la confirma con Alterna y la borra de la barra de direcciones).
      · Sin sesión: va al login de Alterna y, al entrar, apps.html regresa aquí solo.
      · #salir: la sesión guardada ya no vale (la rechazó el servidor) → se pide entrar de nuevo.
      Para cambiar de servidor: SERVIDOR_URL.
    -->
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(ellipse 60% 50% at 30% 30%, rgba(255,255,255,.04) 0%, transparent 70%),
                #0f0f0f;
            color: #f5f5f7; -webkit-font-smoothing: antialiased;
        }
        .caja { width: min(360px, calc(100% - 32px)); }
        img { height: 30px; width: auto; filter: brightness(0) invert(1); margin-bottom: 40px; }
        h1 { margin: 0 0 6px; font-size: 24px; font-weight: 600; letter-spacing: -.4px; }
        p { margin: 0 0 26px; font-size: 14px; color: #8e8e93; line-height: 1.5; }
        .giro { width: 24px; height: 24px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.12); border-top-color: #f5f5f7; animation: g .8s linear infinite; }
        @keyframes g { to { transform: rotate(360deg); } }
        a.btn { display: none; text-align: center; padding: 13px; border-radius: 10px; background: #f5f5f7; color: #111112; font-weight: 600; font-size: 14px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="caja">
        <img src="logo-alterna.png" alt="Alterna">
        <h1>Servidor Alterna</h1>
        <p id="texto">Abriendo el servidor con tu sesión de Alterna…</p>
        <div class="giro" id="giro"></div>
        <a class="btn" id="btn" href="servidor.html">Intentar de nuevo</a>
    </div>
<script>
    // Panel del servidor Ubuntu (en /panel/). Si esta web ya la sirve el propio servidor, es la misma dirección
    const SERVIDOR_URL = (location.hostname.endsWith("github.io") || !location.protocol.startsWith("http") ? "https://srv.tailbbc6ef.ts.net" : location.origin) + "/panel/";

    (() => {
        let token = "";
        if (location.hash === "#salir") {
            try { localStorage.removeItem("usuario"); } catch { /* sin almacenamiento */ }
            history.replaceState(null, "", location.pathname);
        } else {
            try { token = JSON.parse(localStorage.getItem("usuario"))?.token || ""; } catch { /* sin sesión */ }
        }

        if (!/^[\w-]{16,128}$/.test(token)) {
            // Sin sesión: al login de Alterna; después del login, apps.html regresa a esta página
            try { sessionStorage.setItem("alterna_volver", "servidor.html"); } catch { /* sin almacenamiento */ }
            document.getElementById("texto").textContent = "Inicia sesión en Alterna para entrar al servidor…";
            location.replace("index.html");
            return;
        }
        location.replace(SERVIDOR_URL + "#alterna=" + encodeURIComponent(token));
        // Si el navegador no pudo salir de aquí (bloqueado, sin red), se deja un botón
        setTimeout(() => {
            document.getElementById("texto").textContent = "No se pudo abrir el servidor. Revisa tu conexión e inténtalo de nuevo.";
            document.getElementById("giro").style.display = "none";
            document.getElementById("btn").style.display = "block";
        }, 8000);
    })();
</script>
</body>
</html>
