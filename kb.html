<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de conocimiento · Alterna</title>
    <link rel="icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ia.css">
    <link rel="stylesheet" href="kb.css">
</head>
<body>
<div class="app" id="app">
    <aside class="sb" id="sb">
        <div class="sb-top">
            <div class="sb-brand"><img src="logo-alterna.png" alt="Alterna"><span class="tag">KB</span></div>
            <button class="btn-new" id="btnInicio">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20V3H6.5A2.5 2.5 0 004 5.5v14zM20 17v4H6.5A2.5 2.5 0 014 18.5"/></svg>
                Base de conocimiento
            </button>
            <div class="search">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                <input id="buscar" type="search" placeholder="Buscar guías (Enter = búsqueda inteligente)" autocomplete="off">
            </div>
        </div>
        <div class="convs" id="arbol"></div>
        <div class="sb-foot">
            <div class="me">
                <div class="av" id="meAv">--</div>
                <div><div class="nm" id="meNm">Cargando…</div><div class="rl" id="meRl"></div></div>
            </div>
            <div class="foot-links">
                <button id="btnIA"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.4L19 9l-5.2 1.6L12 16l-1.8-5.4L5 9l5.2-1.6L12 2z"/></svg>Alterna IA</button>
                <button id="btnVolver"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Sistema</button>
            </div>
        </div>
    </aside>
    <div class="overlay" id="overlay"></div>

    <main class="main">
        <header class="topbar">
            <button class="icon-btn menu-btn" id="btnMenu" aria-label="Menú"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
            <div class="title" id="titulo">Base de conocimiento</div>
            <span class="badge" id="badgeSync">Alterna</span>
            <div class="sp"></div>
            <button class="icon-btn" id="btnTema" title="Cambiar tema" aria-label="Cambiar tema"></button>
        </header>
        <div class="scroll" id="scroll"><div id="vista"></div></div>
    </main>
</div>
<div class="toast" id="toast"></div>
<script src="kb.js"></script>
</body>
</html>
